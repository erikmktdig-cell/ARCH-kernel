[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arch-kernel"
dynamic = ["version"]
description = "Deterministic contract, validation, schema, and migration kernel for ARch."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "ARch Kernel Maintainers" },
]
keywords = ["architecture", "contracts", "deterministic", "json-schema", "validation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "hypothesis>=6.0",
  "jsonschema>=4.0",
  "mypy>=1.13",
  "pip-audit>=2.9",
  "pip-licenses>=5.0",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
  "twine>=6.0",
  "types-jsonschema>=4.0",
]

[tool.hatch.version]
path = "src/arch_kernel/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_kernel"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "arch_kernel/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/schemas",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=arch_kernel",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
filterwarnings = [
  "default",
]
markers = [
  "unit: focused unit tests",
  "contract: serialized fixture and cross-layer contract tests",
  "property: Hypothesis and metamorphic property tests",
  "regression: stable public identity and fingerprint snapshots",
  "release: release metadata, distribution, policy, and reproducibility tests",
  "slow: bounded high-example property tests",
]

[tool.coverage.run]
branch = true
source = ["src/arch_kernel"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "PTH",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/arch_kernel", "tests", "scripts"]
warn_unused_configs = true
show_error_codes = true
pretty = true
